name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile scripts/*.py $(find tasks -name 'verifier.py' -print)
      - name: Validate repository contracts
        run: python scripts/validate_repo.py
      - name: Regenerate report
        run: python scripts/summarize_runs.py
      - name: Build site
        run: python scripts/build_site.py
